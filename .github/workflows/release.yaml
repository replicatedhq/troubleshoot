name: release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  goreleaser:
    runs-on: troubleshoot_release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          check-latest: true

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2
        with:
          cosign-release: 'v3.1.3'

      - name: Generate and sign SBOM
        run: make sbom
        env:
          COSIGN_KEY: ${{ secrets.COSIGN_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "v2.12.3"
          args: release --clean --config deploy/.goreleaser.yaml
        env:
          GITHUB_TOKEN: ${{ secrets.HOMEBREW_GITHUB_TOKEN }}

      - name: Attest CLI release artifacts
        id: attest_cli
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/preflight_*.tar.gz
            dist/preflight_*.zip
            dist/support-bundle_*.tar.gz
            dist/support-bundle_*.zip

      - name: Add provenance bundle to release
        uses: actions/github-script@v9
        env:
          BUNDLE_PATH: ${{ steps.attest_cli.outputs.bundle-path }}
        with:
          script: |
            const fs = require('fs');
            const tag = process.env.GITHUB_REF_NAME;
            const name = `troubleshoot_${tag}_provenance.sigstore.json`;
            const bundle = await fs.promises.readFile(process.env.BUNDLE_PATH);
            const { data: release } = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag,
            });

            await github.rest.repos.uploadReleaseAsset({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release.id,
              name,
              data: bundle,
              headers: {
                'content-type': 'application/json',
                'content-length': bundle.length,
              },
            });

      - name: Update new preflight version in krew-index
        if: ${{ !contains(github.ref_name, '-') }}
        uses: rajatjindal/krew-release-bot@v0.0.51
        with:
          krew_template_file: deploy/krew/preflight.yaml

      - name: Update new support-bundle version in krew-index
        if: ${{ !contains(github.ref_name, '-') }}
        uses: rajatjindal/krew-release-bot@v0.0.51
        with:
          krew_template_file: deploy/krew/support-bundle.yaml

  securebuild:
    if: ${{ !contains(github.ref_name, '-') }}
    uses: ./.github/workflows/publish-securebuild.yml
    with:
      version: ${{ github.ref_name }}
    secrets:
      SECUREBUILD_API_TOKEN: ${{ secrets.SECUREBUILD_API_TOKEN }}

  notify:
    if: ${{ !contains(github.ref_name, '-') }}
    uses: replicatedhq/reusable-workflows/.github/workflows/notify-release.yml@0432fb838fc83852b78be97a150b35991a85d56f
    with:
      tag: ${{ github.ref_name }}
    secrets:
      slack_webhook: ${{ secrets.RELEASE_SLACK_WEBHOOK }}
